[project]
name = "wcl-core"
version = "4.3.0"
description = "Warcraft Logs client, raid analysis and models for TBC Classic, with no UI or storage"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcl_core"]
