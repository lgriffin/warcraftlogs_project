name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Sigstore keyless signing of SHA256SUMS via GitHub OIDC (no private key held by anyone)

jobs:
  # REL-03: the Linux bundle is this tag's source with the install script, released only after it installs and
  # starts on AlmaLinux 9. The Windows job checksums and signs it with the Windows files.
  linux:
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: Install git (checkout falls back to a plain download without it, and git archive needs it)
        run: dnf install -y git tar gzip

      - uses: actions/checkout@v7

      - name: Install with the Linux install script
        run: scripts/install_linux.sh --no-desktop

      - name: Start the desktop app on a real X server
        run: scripts/smoke_linux.sh

      - name: Package the Linux bundle
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p dist
          ref="${GITHUB_REF_NAME//\//-}"  # a branch dispatch (feature/x) must not add a directory
          name="WarcraftLogsAnalyzer-$ref-linux"
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          tar -tzf "dist/$name.tar.gz" "$name/scripts/install_linux.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: dist/*.tar.gz

  build:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "PySide6>=6.6.0"
          pip install pyinstaller Pillow

      - name: Convert icon
        run: python -c "from PIL import Image; Image.open('logo.png').save('logo.ico')"

      - name: Build with PyInstaller
        run: pyinstaller warcraftlogs_analyzer.spec

      - name: Create portable zip
        run: |
          $ref = "${{ github.ref_name }}" -replace '/', '-'
          $zip = "dist\WarcraftLogsAnalyzer-$ref-portable.zip"
          Compress-Archive -Path "dist\WarcraftLogsAnalyzer\*" -DestinationPath $zip

      - name: Build installer with Inno Setup
        id: inno
        continue-on-error: true
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer.iss

      - name: Kill orphan ISCC process
        if: always()
        run: Get-Process -Name "ISCC" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Wait for file locks to release
        if: steps.inno.outcome == 'success'
        run: Start-Sleep -Seconds 10

      # REQ-CORE-REL-001: the in-app updater refuses any zip whose SHA-256 is not listed here.
      - name: Generate SHA256SUMS
        run: |
          $files = @(Get-ChildItem "dist\*.zip" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem "dist\*.tar.gz" -ErrorAction SilentlyContinue)
          if ("${{ steps.inno.outcome }}" -eq "success") {
            $files += @(Get-ChildItem "installer_output\*.exe" -ErrorAction SilentlyContinue)
          }
          if ($files.Count -eq 0) { throw "No release files to checksum" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          # sha256sum format: LF line endings, UTF-8 without BOM
          [IO.File]::WriteAllText("$PWD\SHA256SUMS", (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: the signing certificate is issued to this workflow's OIDC identity, and the
      # signature is recorded in the public Rekor transparency log. No long-lived key exists.
      - name: Sign SHA256SUMS (Sigstore keyless)
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verify SHA256SUMS signature
        run: >-
          cosign verify-blob SHA256SUMS
          --bundle SHA256SUMS.sigstore.json
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/build-installer\.yml@"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WarcraftLogsAnalyzer
          path: |
            installer_output/*.exe
            dist/*.zip
            dist/*.tar.gz
            SHA256SUMS
            SHA256SUMS.sigstore.json

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer_output/*.exe
            dist/*.zip
            dist/*.tar.gz
            SHA256SUMS
            SHA256SUMS.sigstore.json
          generate_release_notes: true
