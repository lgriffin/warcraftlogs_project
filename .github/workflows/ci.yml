name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Every job is blocking.
# Checks run through scripts/dev.py, so `python scripts/dev.py check` locally runs exactly these commands.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Ruff check
        run: python scripts/dev.py lint
      - name: Ruff format check
        run: python scripts/dev.py format
      - name: Codespell
        run: python scripts/dev.py spelling
      - name: Vulture dead code check
        run: python scripts/dev.py deadcode
      - name: Import contracts (wcl-core stays headless, wcl-store stays persistence only, wcl-app needs no desktop)
        run: python scripts/dev.py imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover compares against origin/master
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python scripts/dev.py test
      - name: Coverage of the lines this PR changes
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        run: python scripts/dev.py diffcov

  wcl-core-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wcl-core wheel on its own
        run: |
          pip install --upgrade pip build
          python -m build --wheel packages/wcl-core -o dist
      - name: Import it without the desktop app (as the Toads Hub worker does)
        working-directory: ${{ runner.temp }}
        env:
          WCL_APP_DIR: ${{ runner.temp }}
        run: |
          python -m venv core-only
          core-only/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          core-only/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import wcl_core
          for module in pkgutil.walk_packages(wcl_core.__path__, "wcl_core."):
              importlib.import_module(module.name)
          from wcl_core import paths
          assert "warcraftlogs_client" not in sys.modules
          assert paths.get_consumes_config_path().is_file()
          PY

  wcl-store-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wcl-core and wcl-store wheels on their own
        run: |
          pip install --upgrade pip build
          python -m build --wheel packages/wcl-core -o dist
          python -m build --wheel packages/wcl-store -o dist
      - name: Import every module without the desktop app (as the Toads Hub worker does)
        working-directory: ${{ runner.temp }}
        env:
          WCL_APP_DIR: ${{ runner.temp }}
        run: |
          python -m venv store-only
          store-only/bin/pip install "$GITHUB_WORKSPACE"/dist/wcl_core-*.whl "$(ls "$GITHUB_WORKSPACE"/dist/wcl_store-*.whl)[postgres]"
          store-only/bin/python -c "import sys, wcl_store.sqlite, wcl_store.postgres, wcl_store.postgres.schema; assert 'warcraftlogs_client' not in sys.modules; assert wcl_store.postgres.MIGRATIONS_DIR.joinpath('env.py').is_file()"

  # REQ-CORE-APP-001: the services install and run without the desktop app.
  wcl-app-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wcl-core, wcl-store and wcl-app wheels on their own
        run: |
          pip install --upgrade pip build
          python -m build --wheel packages/wcl-core -o dist
          python -m build --wheel packages/wcl-store -o dist
          python -m build --wheel packages/wcl-app -o dist
      - name: Import every module and run a raid headless, without the desktop app (as the Toads Hub worker does)
        working-directory: ${{ runner.temp }}
        env:
          WCL_APP_DIR: ${{ runner.temp }}
        run: |
          python -m venv app-only
          app-only/bin/pip install "$GITHUB_WORKSPACE"/dist/wcl_core-*.whl "$GITHUB_WORKSPACE"/dist/wcl_store-*.whl "$GITHUB_WORKSPACE"/dist/wcl_app-*.whl
          app-only/bin/python - <<'PY'
          import importlib, pkgutil, sys
          from unittest.mock import MagicMock, patch
          import wcl_app
          for module in pkgutil.walk_packages(wcl_app.__path__, "wcl_app."):
              importlib.import_module(module.name)
          from wcl_app import AppContext, RaidService
          assert "warcraftlogs_client" not in sys.modules
          assert not {"PySide6", "sqlite3", "sqlalchemy"} & {m.split(".")[0] for m in sys.modules}

          class Repo:
              def __enter__(self): return self
              def __exit__(self, *exc): return False
              def get_role_overrides_for_report(self, code): return {"Holy": "tank"}
              def import_raid(self, analysis, source="guild"): self.saved = (analysis, source)

          repo, client = Repo(), MagicMock()
          ctx = AppContext.headless(client, storage=lambda: repo)
          with patch("wcl_app.raids.analyze_raid") as analyze:
              RaidService(ctx).analyze_and_save("raidReport000001")
          assert analyze.call_args.args[0] is client
          assert analyze.call_args.kwargs["role_overrides"] == {"Holy": "tank"}
          assert repo.saved[1] == "guild"
          assert "warcraftlogs_client" not in sys.modules
          PY

  # REQ-CORE-STORE-001: the storage contract on a real Postgres (the SQLite half runs in `test`).
  storage-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          # Throwaway CI database on localhost only; trust auth avoids a password in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WCL_STORE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,postgres]"
      - name: Storage contract, migrations and REQ-CORE-STORE-001 scenarios on both backends, with no skips
        shell: bash
        run: |
          pytest --tb=short -v -rs tests/test_store_contract.py tests/test_wcl_store_package.py \
            tests/test_wcl_app_package.py tests/test_home_service.py tests/step_defs/test_storage.py | tee pg.log
          ! grep -q "SKIPPED" pg.log

  gui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,gui]"
      - name: Run GUI tests
        env:
          # Qt's offscreen platform needs no X server libraries (xcb crashed on startup under xvfb).
          QT_QPA_PLATFORM: offscreen
        run: python scripts/dev.py gui

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Run fuzz tests
        run: python scripts/dev.py fuzz

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Run mypy
        run: python scripts/dev.py types

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Run bandit and the security tests
        run: python scripts/dev.py security
      - name: pip-audit
        # --skip-editable: the project itself is installed -e and is not on PyPI (--strict would fail on it)
        run: python scripts/dev.py audit
