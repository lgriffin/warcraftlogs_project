repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        args: ["--config", "pyproject.toml"]

  # Uses the mypy from `pip install -e ".[dev]"`, so it sees the installed packages and matches CI.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy warcraftlogs_client/ packages/wcl-core/src/ packages/wcl-store/src/ packages/wcl-app/src/ --exclude gui/
        language: system
        types: [python]
        pass_filenames: false
