# Install once with `pre-commit install` after `pip install -e ".[dev]"`.
# The checks below are `local`/`system` hooks: they run the tools pinned in pyproject.toml's dev extra, against the
# installed packages, so pre-commit, `python scripts/dev.py check` and CI all use the same versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, with fixes)
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
        files: ^(warcraftlogs_client|packages/wcl-[a-z]+/src|tests)/
      - id: import-contracts
        name: import-linter (package layering)
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true  # the contracts live in pyproject.toml, so a config-only commit must run them too
      - id: mypy
        name: mypy
        entry: python scripts/dev.py types
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture (dead code)
        entry: python scripts/dev.py deadcode
        language: system
        types: [python]
        pass_filenames: false
