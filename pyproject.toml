[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warcraftlogs-analyzer"
version = "4.3.0"
description = "Analyze Warcraft Logs raid reports with role-based performance tracking"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6.0", "pytest-qt>=4.2"]
# The Postgres backend of wcl-store (same pins as wcl-store[postgres]); the desktop app never needs it.
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
# Every checker is pinned: a new release can add rules, so upgrades land through a Dependabot PR, not a red master,
# and `python scripts/dev.py check` gives the same verdict locally as CI. Pre-commit runs these same installs.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-bdd>=7.0",
    "hypothesis>=6.0",
    "pytest-xdist>=3.0",
    "ruff==0.16.9",
    "mypy==1.19.1",
    "bandit[toml]==1.9.4",
    "pre-commit>=4.0",
    "vulture==2.16",
    "pip-audit>=2.7",
    "codespell==2.4.3",
    "import-linter==2.15",
]

[project.scripts]
warcraftlogs = "warcraftlogs_client.cli:main"

[project.gui-scripts]
warcraftlogs-gui = "warcraftlogs_client.gui.app:run"

# The desktop app and CLI install wcl-core, wcl-store and wcl-app from the same checkout, so `pip install -e .`
# and PyInstaller keep working unchanged. Other projects install packages/wcl-core, packages/wcl-store and
# packages/wcl-app on their own.
[tool.setuptools.packages.find]
where = [".", "packages/wcl-core/src", "packages/wcl-store/src", "packages/wcl-app/src"]
include = ["warcraftlogs_client*", "wcl_core*", "wcl_store*", "wcl_app*"]

[tool.setuptools.package-data]
wcl_core = ["py.typed", "data/*.json", "data/spell_data/*.json"]
wcl_store = ["py.typed"]
wcl_app = ["py.typed"]
"wcl_store.postgres" = ["migrations/*.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Ruff 0.16+ formats Markdown code fences experimentally; keep lint/format on Python only.
extend-exclude = ["guides", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "C4", "RUF", "BLE", "PTH", "PERF", "S", "C90"]
ignore = [
    "E402", "E501", "E701", "SIM102", "SIM108", "SIM116",
    # Loops that append stay readable, and try/except in a loop is free on 3.11+.
    "PERF203", "PERF401",
    # The same choices as bandit's skips: asserts narrow types, and subprocess always gets a fixed argument list.
    "S101", "S404", "S603", "S607",
]

[tool.ruff.lint.mccabe]
# New functions stay at or under 15 branches. The older functions above it carry `# noqa: C901` until they are split.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Qt slots and workers are the top-level boundary that reports any failure to the user; the GUI is also outside mypy.
"warcraftlogs_client/gui/*" = ["B008", "RUF012", "BLE001", "S110", "PTH"]
# SQL lives only in wcl_store. Queries interpolate internal table and column names; values are always bound.
"packages/wcl-store/src/wcl_store/*" = ["S608"]
"tests/*" = ["B008", "RUF012", "SIM105", "SIM115", "BLE001", "S105", "S106", "S110", "S311", "S608"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["warcraftlogs_client/gui/"]

# Strict typing for the shared packages: every function in them is annotated and its body checked.
[[tool.mypy.overrides]]
module = ["wcl_store.*", "wcl_app.*", "wcl_core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B105", "B110", "B404", "B603", "B607", "B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features/"
addopts = "--strict-markers"
markers = [
    "ears_event_driven: EARS event-driven requirement (When trigger, system shall respond)",
    "ears_ubiquitous: EARS ubiquitous requirement (system shall always behave this way)",
    "ears_unwanted_behavior: EARS unwanted-behavior requirement (If condition, system shall handle)",
    "ears_state_driven: EARS state-driven requirement (While state, system shall behave)",
    "ears_optional: EARS optional requirement (Where feature, system shall behave)",
    "database: Tests involving SQLite database operations",
    "postgres: Tests that need a Postgres server (skipped unless WCL_STORE_TEST_DATABASE_URL is set)",
    "api: Tests involving WCL API client or network calls",
    "auth: Tests involving authentication and token management",
    "reference: Tests for reference report comparison features",
    "gui: Tests requiring PySide6 GUI framework",
    "fuzz: Property-based fuzz tests using hypothesis",
    "security: Security-focused tests",
    "integration: Integration tests spanning multiple modules",
    "live: Tests hitting real external APIs (opt-in)",
    "slow: Tests that take significant time to run",
]

[tool.coverage.run]
source = ["warcraftlogs_client", "wcl_core", "wcl_store", "wcl_app"]
omit = ["warcraftlogs_client/gui/*"]

[tool.coverage.report]
fail_under = 55
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.codespell]
skip = ".git,.venv,.mypy_cache,.ruff_cache,.pytest_cache,*.egg-info,build,dist,*.db,*.ico,*.png,*.csv,spell_data,reports,*.spec"
ignore-words-list = "casted,hist,sting,datas,levae"
count = true
quiet-level = 3

[tool.vulture]
paths = [
    "warcraftlogs_client",
    "packages/wcl-core/src",
    "packages/wcl-store/src",
    "packages/wcl-app/src",
    "vulture_whitelist.py",
]
exclude = ["warcraftlogs_client/gui/"]
min_confidence = 80

# REQ-CORE-ARCH-001: wcl-core stays headless so the desktop app and the Toads Hub worker can share it.
# REQ-CORE-STORE-002: wcl-store is persistence only, and its SQLite side never needs the Postgres extra.
# REQ-CORE-APP-001: wcl-app (services) installs and runs without the desktop app.
[tool.importlinter]
root_packages = ["wcl_core", "wcl_store", "wcl_app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "wcl-core imports no Qt, SQLite, SQLAlchemy or desktop code"
type = "forbidden"
source_modules = ["wcl_core"]
forbidden_modules = ["PySide6", "sqlite3", "sqlalchemy", "warcraftlogs_client"]

[[tool.importlinter.contracts]]
name = "wcl-store imports no Qt, web, bot or desktop code"
type = "forbidden"
source_modules = ["wcl_store"]
forbidden_modules = ["PySide6", "fastapi", "discord", "warcraftlogs_client"]

[[tool.importlinter.contracts]]
name = "wcl-store's SQLite side needs no Postgres extra"
type = "forbidden"
source_modules = ["wcl_store.errors", "wcl_store.repository", "wcl_store._codec", "wcl_store.sqlite"]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic", "wcl_store.postgres"]

# Services reach SQLite only through wcl_store.sqlite (AppContext.db, the desktop default), never directly.
[[tool.importlinter.contracts]]
name = "wcl-app never imports sqlite3 itself"
type = "forbidden"
source_modules = ["wcl_app"]
forbidden_modules = ["sqlite3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "wcl-app imports no Qt, web, bot or desktop code, even indirectly"
type = "forbidden"
source_modules = ["wcl_app"]
forbidden_modules = ["PySide6", "fastapi", "discord", "warcraftlogs_client"]
